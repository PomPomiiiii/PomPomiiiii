<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kiel Cabungcal - Full-Stack Flutter Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0f1f3d">
        <animate attributeName="stop-color" values="#0f1f3d;#1a1040;#0b2a3a;#0f1f3d" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#54c5f8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- floating glow orbs -->
    <circle cx="150" cy="80" r="90" fill="#54c5f8" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cy" values="80;200;80" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="150;230;150" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="200" r="100" fill="#a78bfa" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cy" values="200;60;200" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="850;760;850" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="250" r="80" fill="#34d399" opacity="0.25" filter="url(#blur)">
      <animate attributeName="cy" values="250;190;250" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- floating code symbols -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#54c5f8" filter="url(#glow)">
      <text x="70" y="230" opacity="0.5">&lt;/&gt;
        <animate attributeName="y" values="230;212;230" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="900" y="70" opacity="0.5" fill="#a78bfa">{ }
        <animate attributeName="y" values="70;88;70" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="820" y="240" opacity="0.4" fill="#34d399">()=&gt;
        <animate attributeName="y" values="240;225;240" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="110" y="60" opacity="0.4" fill="#a78bfa">[ ]
        <animate attributeName="y" values="60;78;60" dur="6.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- text -->
    <g text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="500" y="75" font-size="15" letter-spacing="6" fill="#8b949e" opacity="0">HELLO, WORLD — I'M
        <animate attributeName="opacity" values="0;1" dur="1s" begin="0.2s" fill="freeze"/>
      </text>
      <text x="500" y="150" font-size="68" font-weight="800" fill="url(#title)" opacity="0">Kiel Cabungcal
        <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.6s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 18;0 0" dur="1.2s" begin="0.6s" fill="freeze"/>
      </text>
      <text x="500" y="196" font-size="22" fill="#c9d1d9" opacity="0">Full-Stack Flutter Developer
        <animate attributeName="opacity" values="0;1" dur="1s" begin="1.4s" fill="freeze"/>
      </text>
      <text x="500" y="228" font-size="15" fill="#8b949e" opacity="0">Mobile  •  Web  •  Backend
        <animate attributeName="opacity" values="0;1" dur="1s" begin="2s" fill="freeze"/>
      </text>
    </g>

    <!-- animated underline -->
    <rect x="300" y="244" width="0" height="3" rx="1.5" fill="url(#title)">
      <animate attributeName="width" values="0;400" dur="1.4s" begin="2.2s" fill="freeze"/>
    </rect>
  </g>
  <rect width="1000" height="280" rx="18" fill="none" stroke="#30363d"/>
</svg>
