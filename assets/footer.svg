<svg width="1000" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Building across mobile, web and backend" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#54c5f8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- waves -->
  <path fill="url(#g)" opacity="0.25" d="M0 60 C 200 20, 300 100, 500 60 S 800 20, 1000 60 V140 H0 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 60 C 200 20, 300 100, 500 60 S 800 20, 1000 60 V140 H0 Z;
              M0 60 C 200 100, 300 20, 500 60 S 800 100, 1000 60 V140 H0 Z;
              M0 60 C 200 20, 300 100, 500 60 S 800 20, 1000 60 V140 H0 Z"/>
  </path>
  <path fill="url(#g)" opacity="0.45" d="M0 80 C 250 50, 350 110, 500 80 S 750 50, 1000 80 V140 H0 Z">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0 80 C 250 50, 350 110, 500 80 S 750 50, 1000 80 V140 H0 Z;
              M0 80 C 250 110, 350 50, 500 80 S 750 110, 1000 80 V140 H0 Z;
              M0 80 C 250 50, 350 110, 500 80 S 750 50, 1000 80 V140 H0 Z"/>
  </path>
  <path fill="url(#g)" d="M0 105 C 300 85, 400 125, 500 105 S 700 85, 1000 105 V140 H0 Z"/>
  <text x="500" y="52" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="18" fill="#c9d1d9" letter-spacing="1">
    Building across mobile, web &amp; backend — one project at a time.
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
